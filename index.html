<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CloudAttend — Sistem Presensi Cerdas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
/* ── RESET & BASE ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #080d1a;
  --bg2:        #0d1528;
  --bg3:        #111d35;
  --surface:    #162040;
  --surface2:   #1e2d55;
  --border:     rgba(99,179,237,0.12);
  --border2:    rgba(99,179,237,0.25);
  --accent:     #3b82f6;
  --accent2:    #60a5fa;
  --accent3:    #93c5fd;
  --green:      #10b981;
  --green2:     #34d399;
  --red:        #ef4444;
  --amber:      #f59e0b;
  --purple:     #8b5cf6;
  --text:       #e8f0fe;
  --text2:      #94afc8;
  --text3:      #5a7599;
  --mono:       'JetBrains Mono', monospace;
  --sans:       'Space Grotesk', sans-serif;
  --radius:     12px;
  --radius2:    20px;
  --shadow:     0 8px 32px rgba(0,0,0,0.5);
  --shadow2:    0 2px 8px rgba(0,0,0,0.3);
  --glow:       0 0 24px rgba(59,130,246,0.25);
  --glow-green: 0 0 24px rgba(16,185,129,0.25);
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── SCROLLBAR ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

/* ── ANIMATIONS ─────────────────────────────────────────── */
@keyframes fadeIn  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulse   { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
@keyframes spin    { to { transform:rotate(360deg); } }
@keyframes scanLine { 0%,100% { top:0%; } 50% { top:calc(100% - 3px); } }
@keyframes glow    { 0%,100% { box-shadow:var(--glow); } 50% { box-shadow:0 0 40px rgba(59,130,246,0.5); } }
@keyframes ripple  { to { transform:scale(4); opacity:0; } }
@keyframes slideIn { from { transform:translateX(-100%); } to { transform:translateX(0); } }
@keyframes timerTick { 0%,100% { color:var(--text); } 50% { color:var(--accent2); } }

/* ── GRID BACKGROUND ────────────────────────────────────── */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none; z-index:0;
}

/* ── LOGIN SCREEN ───────────────────────────────────────── */
#loginScreen {
  position:fixed; inset:0; z-index:1000;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse 80% 80% at 50% 0%, rgba(59,130,246,0.15) 0%, transparent 60%),
              var(--bg);
  animation: fadeIn 0.6s ease;
}
.login-card {
  width: 100%; max-width: 420px; padding: 48px 40px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius2);
  box-shadow: var(--shadow), var(--glow);
}
.login-logo {
  text-align:center; margin-bottom:32px;
}
.login-logo .logo-icon {
  width:64px; height:64px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius:18px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:28px; margin-bottom:16px;
  box-shadow: var(--glow);
  animation: glow 3s ease infinite;
}
.login-logo h1 { font-size:24px; font-weight:700; letter-spacing:-0.5px; }
.login-logo p  { color:var(--text2); font-size:13px; margin-top:4px; }

.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }
.form-group input {
  width:100%; padding:12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text); font-family:var(--sans); font-size:14px;
  outline:none; transition:all 0.2s;
}
.form-group input:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(59,130,246,0.15); }

/* ── BUTTONS ────────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:var(--radius); border:none;
  font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer;
  transition:all 0.2s; position:relative; overflow:hidden; text-decoration:none;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.btn::after {
  content:''; position:absolute;
  width:20px; height:20px; border-radius:50%;
  background:rgba(255,255,255,0.3); transform:scale(0); opacity:0;
  transition:transform 0.5s, opacity 0.3s;
}
.btn:active::after { transform:scale(4); opacity:0; animation:ripple 0.5s ease; }
.btn-primary { background:linear-gradient(135deg, var(--accent), #1d4ed8); color:#fff; width:100%; }
.btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); box-shadow:var(--glow); }
.btn-success { background:linear-gradient(135deg, var(--green), #059669); color:#fff; }
.btn-success:hover { filter:brightness(1.1); box-shadow:var(--glow-green); }
.btn-danger  { background:linear-gradient(135deg, var(--red), #b91c1c); color:#fff; }
.btn-ghost   { background:transparent; color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface); color:var(--text); }
.btn-sm { padding:8px 14px; font-size:12px; }
.btn-lg { padding:16px 28px; font-size:16px; }
.btn-icon { width:36px; height:36px; padding:0; }
.btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }

/* ── APP LAYOUT ─────────────────────────────────────────── */
#app {
  display:none; min-height:100dvh;
  flex-direction:column; position:relative; z-index:1;
}
#app.visible { display:flex; }

/* ── SIDEBAR ────────────────────────────────────────────── */
.sidebar {
  position:fixed; left:0; top:0; bottom:0; width:260px;
  background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:100;
  transform:translateX(-100%); transition:transform 0.3s cubic-bezier(.4,0,.2,1);
}
.sidebar.open { transform:translateX(0); }
.sidebar-header {
  padding:24px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.sidebar-logo {
  width:40px; height:40px; background:linear-gradient(135deg, var(--accent), var(--purple));
  border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px;
}
.sidebar-title { font-weight:700; font-size:15px; }
.sidebar-sub   { font-size:11px; color:var(--text2); font-family:var(--mono); }

.sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
.nav-section-label {
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
  color:var(--text3); padding:8px 8px 4px;
}
.nav-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:10px; cursor:pointer;
  color:var(--text2); font-size:14px; font-weight:500;
  transition:all 0.15s; margin-bottom:2px;
  border:1px solid transparent;
}
.nav-item:hover { background:var(--surface); color:var(--text); }
.nav-item.active {
  background:rgba(59,130,246,0.12); color:var(--accent2);
  border-color:rgba(59,130,246,0.2);
}
.nav-item .icon { font-size:18px; width:24px; text-align:center; }
.nav-badge {
  margin-left:auto; background:var(--accent); color:#fff;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px;
}

.sidebar-footer {
  padding:16px; border-top:1px solid var(--border);
}
.user-card {
  display:flex; align-items:center; gap:10px;
  padding:10px; border-radius:10px; background:var(--surface);
}
.user-avatar {
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg, var(--accent), var(--purple));
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; flex-shrink:0;
}
.user-name  { font-size:13px; font-weight:600; }
.user-role  { font-size:11px; color:var(--text2); font-family:var(--mono); }

/* ── TOPBAR ─────────────────────────────────────────────── */
.topbar {
  position:sticky; top:0; z-index:50;
  background:rgba(8,13,26,0.85); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
}
.topbar-title { font-size:16px; font-weight:700; flex:1; }
.topbar-actions { display:flex; align-items:center; gap:8px; }

/* ── MAIN CONTENT ───────────────────────────────────────── */
.main {
  flex:1; padding:20px 16px; max-width:1200px;
  width:100%; margin:0 auto;
}

/* ── OVERLAY ────────────────────────────────────────────── */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px); z-index:90; opacity:0;
  pointer-events:none; transition:opacity 0.3s;
}
.overlay.active { opacity:1; pointer-events:all; }

/* ── CARDS ──────────────────────────────────────────────── */
.card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius2); padding:20px;
  animation:fadeIn 0.4s ease;
}
.card + .card { margin-top:16px; }
.card-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:16px; }

/* ── STAT CARDS ─────────────────────────────────────────── */
.stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:20px; }
.stat-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius2); padding:20px;
  position:relative; overflow:hidden;
  animation:fadeIn 0.4s ease both;
}
.stat-card::before {
  content:''; position:absolute; right:-20px; top:-20px;
  width:80px; height:80px; border-radius:50%;
  background:var(--accent-color, var(--accent)); opacity:0.06;
}
.stat-icon  { font-size:24px; margin-bottom:12px; }
.stat-value { font-size:28px; font-weight:700; font-family:var(--mono); letter-spacing:-1px; }
.stat-label { font-size:12px; color:var(--text2); margin-top:4px; font-weight:500; }
.stat-delta { font-size:11px; color:var(--green); margin-top:8px; font-family:var(--mono); }

/* ── QR DISPLAY ─────────────────────────────────────────── */
.qr-wrapper {
  display:flex; flex-direction:column; align-items:center;
  gap:16px; padding:24px 0;
}
.qr-frame {
  position:relative; padding:16px;
  background:white; border-radius:16px;
  box-shadow:var(--shadow), var(--glow);
  animation:glow 3s ease infinite;
}
.qr-frame::before, .qr-frame::after {
  content:''; position:absolute; width:20px; height:20px;
  border-color:var(--accent); border-style:solid;
}
.qr-frame::before { top:4px; left:4px; border-width:2px 0 0 2px; }
.qr-frame::after  { bottom:4px; right:4px; border-width:0 2px 2px 0; }
.qr-scan-line {
  position:absolute; left:16px; right:16px; height:3px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  animation:scanLine 2.5s ease infinite;
  border-radius:2px;
}

.qr-token-badge {
  font-family:var(--mono); font-size:18px; font-weight:700;
  color:var(--accent2); letter-spacing:3px;
  background:var(--surface); padding:8px 20px; border-radius:8px;
  border:1px solid var(--border2);
}
.qr-timer {
  font-family:var(--mono); font-size:13px; color:var(--text2);
  animation:timerTick 1s ease infinite;
}
.qr-timer.urgent { color:var(--red) !important; }

/* ── QR SCANNER ─────────────────────────────────────────── */
.scanner-wrapper { position:relative; border-radius:16px; overflow:hidden; }
#scanVideo { width:100%; display:block; border-radius:16px; }
.scanner-overlay {
  position:absolute; inset:0;
  background:linear-gradient(rgba(0,0,0,0.5) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.5) 100%);
}
.scanner-box {
  position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
  width:200px; height:200px;
}
.scanner-box::before, .scanner-box::after,
.scanner-box .corner-br, .scanner-box .corner-tl {
  content:''; position:absolute; width:24px; height:24px;
  border-color:#fff; border-style:solid;
}
.scanner-box::before { top:0; left:0; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
.scanner-box::after  { top:0; right:0; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
.scanner-box .corner-br { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
.scanner-box .corner-tl { bottom:0; left:0; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
.scan-beam {
  position:absolute; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--green), transparent);
  animation:scanLine 2s linear infinite;
}

/* ── PRESENCE STATUS ────────────────────────────────────── */
.presence-badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
}
.presence-badge.checked_in  { background:rgba(16,185,129,0.15); color:var(--green2); border:1px solid rgba(16,185,129,0.3); }
.presence-badge.not_checked  { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
.presence-badge.checked_out  { background:rgba(99,102,241,0.15); color:#a5b4fc; border:1px solid rgba(99,102,241,0.3); }
.presence-badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

/* ── MAP ────────────────────────────────────────────────── */
#gpsMap { height:280px; border-radius:16px; border:1px solid var(--border); }

/* ── TABLE ──────────────────────────────────────────────── */
.table-wrap { overflow-x:auto; border-radius:var(--radius); }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead { background:var(--surface); }
th { padding:10px 14px; text-align:left; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.7px; white-space:nowrap; }
td { padding:10px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(59,130,246,0.04); }

/* ── FORM ELEMENTS ──────────────────────────────────────── */
.input-group { margin-bottom:14px; }
.input-group label { display:block; font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.7px; margin-bottom:6px; }
.input, select.input, textarea.input {
  width:100%; padding:10px 14px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); color:var(--text);
  font-family:var(--sans); font-size:14px; outline:none;
  transition:all 0.2s;
}
.input:focus, select.input:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(59,130,246,0.12); }
select.input option { background:var(--bg2); }

/* ── TOAST ──────────────────────────────────────────────── */
.toast-container { position:fixed; bottom:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
.toast {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-radius:12px; min-width:280px; max-width:360px;
  box-shadow:var(--shadow);
  animation:fadeIn 0.3s ease;
  border:1px solid var(--border);
}
.toast.success { background:rgba(16,185,129,0.15); border-color:rgba(16,185,129,0.3); }
.toast.error   { background:rgba(239,68,68,0.15);  border-color:rgba(239,68,68,0.3); }
.toast.info    { background:rgba(59,130,246,0.15);  border-color:rgba(59,130,246,0.3); }
.toast .toast-icon { font-size:18px; }
.toast .toast-msg  { font-size:13px; font-weight:500; flex:1; }
.toast .toast-close { font-size:16px; cursor:pointer; opacity:0.6; }

/* ── MODAL ──────────────────────────────────────────────── */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
  z-index:500; display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-bg.open { display:flex; }
.modal {
  background:var(--bg2); border:1px solid var(--border2);
  border-radius:var(--radius2); padding:28px; width:100%; max-width:480px;
  box-shadow:var(--shadow); animation:fadeIn 0.3s ease;
}
.modal-title { font-size:18px; font-weight:700; margin-bottom:20px; }

/* ── TABS ───────────────────────────────────────────────── */
.tabs { display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:12px; margin-bottom:20px; }
.tab { flex:1; padding:8px; border-radius:9px; text-align:center; font-size:12px; font-weight:600; cursor:pointer; color:var(--text2); transition:all 0.2s; border:none; background:transparent; }
.tab.active { background:var(--bg2); color:var(--text); box-shadow:var(--shadow2); }

/* ── PROGRESS ───────────────────────────────────────────── */
.progress-bar { background:var(--surface); border-radius:4px; height:6px; overflow:hidden; }
.progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg, var(--accent), var(--purple)); transition:width 0.5s ease; }

/* ── CHIP/TAG ───────────────────────────────────────────── */
.chip { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.chip-blue   { background:rgba(59,130,246,0.15); color:var(--accent3); }
.chip-green  { background:rgba(16,185,129,0.15); color:var(--green2); }
.chip-red    { background:rgba(239,68,68,0.15);  color:#f87171; }
.chip-amber  { background:rgba(245,158,11,0.15); color:#fcd34d; }
.chip-purple { background:rgba(139,92,246,0.15); color:#c4b5fd; }

/* ── LOADING SPINNER ────────────────────────────────────── */
.spinner { width:20px; height:20px; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }

/* ── EMPTY STATE ────────────────────────────────────────── */
.empty-state { text-align:center; padding:48px 20px; color:var(--text2); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }
.empty-state p { font-size:14px; }

/* ── SECTION HEADER ─────────────────────────────────────── */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.section-title { font-size:16px; font-weight:700; }

/* ── ACCEL CHART ────────────────────────────────────────── */
.accel-bars { display:flex; gap:6px; align-items:flex-end; height:60px; }
.accel-bar { flex:1; border-radius:4px 4px 0 0; transition:height 0.3s ease; }
.accel-bar.x { background:var(--accent); }
.accel-bar.y { background:var(--green); }
.accel-bar.z { background:var(--purple); }
.accel-values { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.accel-val { background:var(--surface); border-radius:8px; padding:8px; text-align:center; }
.accel-val .label { font-size:10px; color:var(--text2); font-weight:700; text-transform:uppercase; }
.accel-val .value { font-family:var(--mono); font-size:14px; font-weight:600; margin-top:2px; }

/* ── GPS INFO ───────────────────────────────────────────── */
.gps-info { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.gps-info-item { background:var(--surface); border-radius:8px; padding:10px; }
.gps-info-item .key { font-size:10px; color:var(--text2); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.gps-info-item .val { font-family:var(--mono); font-size:13px; font-weight:600; margin-top:2px; }

/* ── SUCCESS ANIMATION ──────────────────────────────────── */
.success-checkmark {
  width:80px; height:80px; border-radius:50%;
  background:linear-gradient(135deg, var(--green), #059669);
  display:flex; align-items:center; justify-content:center;
  font-size:36px; margin:0 auto 20px;
  box-shadow:var(--glow-green);
  animation:glow 2s ease infinite;
}

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media (min-width:768px) {
  .sidebar { transform:translateX(0); }
  .main { padding-left:280px; }

// ─── NAVIGATION CONFIG ───────────────────────────────────────

// ── Deteksi apakah berjalan di dalam GAS (via HtmlService) ─
const IS_GAS = typeof google !== 'undefined' && typeof google.script !== 'undefined';

async function api(method, path, data, skipAuth) {
  // ── Mode 1: Berjalan di dalam GAS (HtmlService) ──────────
  if (IS_GAS) {
    return new Promise((resolve) => {
      if (!skipAuth && STATE.token) data = { ...data, auth_token: STATE.token };
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => resolve({ ok: false, error: err.message }))
        .apiCall(method, path, data || {});
    });
  }

  // ── Mode 2: Demo mode (tidak ada BASE_URL) ────────────────
  if (!CONFIG.BASE_URL) {
    return mockApi(method, path, data);
  }

  // ── Mode 3: External hosting → fetch ke GAS ──────────────
  // GAS pathInfo: suffix setelah /exec/
  const gasBase = CONFIG.BASE_URL.replace(/\/exec\/?$/, '');
  const fullUrl = `${gasBase}/exec/${path}`;

  if (method === 'GET') {
    const params = { ...(data || {}) };
    if (!skipAuth && STATE.token) params.auth_token = STATE.token;
    const entries = Object.entries(params).filter(([,v]) => v !== undefined && v !== null && v !== '');
    const qs = new URLSearchParams(Object.fromEntries(entries)).toString();
    const finalUrl = qs ? `${fullUrl}?${qs}` : fullUrl;
    try {
      const res = await fetch(finalUrl, { method: 'GET', redirect: 'follow', mode: 'cors' });
      const text = await res.text();
      try { return JSON.parse(text); } catch(_) { return { ok: false, error: 'invalid_json: ' + text.slice(0,200) }; }
    } catch (err) {
      return { ok: false, error: 'network_error: ' + err.message };
    }
  }

  if (method === 'POST' || method === 'PUT') {
    if (!skipAuth && STATE.token) data = { ...data, auth_token: STATE.token };
    try {
      const res = await fetch(fullUrl, {
        method: 'POST',
        redirect: 'follow',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data || {}),
      });
      const text = await res.text();
      try { return JSON.parse(text); } catch(_) { return { ok: false, error: 'invalid_json: ' + text.slice(0,200) }; }
    } catch (err) {
      return { ok: false, error: 'network_error: ' + err.message };
    }
  }
}

// ─── DEMO MOCK ───────────────────────────────────────────────
const MOCK_DB = {
  users: [
    { user_id:'SA-000001', username:'superadmin', full_name:'Super Administrator', role:'superadmin', is_active:'true' },
    { user_id:'D-000001',  username:'pak_budi',   full_name:'Dr. Budi Santoso, M.Kom', role:'dosen', is_active:'true' },
    { user_id:'M-000001',  username:'andi2023',   full_name:'Andi Pratama', role:'mahasiswa', nim_nip:'2023310001', is_active:'true' },
    { user_id:'M-000002',  username:'sari2023',   full_name:'Sari Dewi', role:'mahasiswa', nim_nip:'2023310002', is_active:'true' },
    { user_id:'M-000003',  username:'rio2023',    full_name:'Rio Firmansyah', role:'mahasiswa', nim_nip:'2023310003', is_active:'true' },

  courses: [
    { course_id:'CRS-CLOUD', course_code:'IF-401', course_name:'Praktik Komputasi Awan', dosen_id:'D-000001', sks:'3', semester:'Gasal 2025/2026', status:'active' },
    { course_id:'CRS-DB',    course_code:'IF-302', course_name:'Basis Data Lanjut',       dosen_id:'D-000001', sks:'3', semester:'Gasal 2025/2026', status:'active' },
  ],

    { session_id:'CRS-CLOUD-S01', course_id:'CRS-CLOUD', course_name:'Praktik Komputasi Awan', session_num:'1', session_date:new Date().toISOString().slice(0,10), start_time:'08:00', end_time:'10:00', topic:'Kickoff & API Contract', room:'Gedung A - 301', status:'scheduled' },
    { session_id:'CRS-CLOUD-S02', course_id:'CRS-CLOUD', course_name:'Praktik Komputasi Awan', session_num:'2', session_date:'2026-03-29', start_time:'08:00', end_time:'10:00', topic:'Google Apps Script Deep Dive', room:'Gedung A - 301', status:'scheduled' },
  ],
  presence: [],
  tokens: [],
};

function mockApi(method, path, data) {
  // Login
  if (path === 'auth/login') {
    const creds = { superadmin:'Admin@2026', pak_budi:'Dosen@2026', andi2023:'Mhs@2026', sari2023:'Mhs@2026', rio2023:'Mhs@2026' };
    const u = MOCK_DB.users.find(u => u.username === data.username);
    if (!u || creds[data.username] !== data.password) return { ok:false, error:'invalid_credentials' };
    return { ok:true, data:{ auth_token:'MOCK-TOKEN-'+u.role, user_id:u.user_id, username:u.username, full_name:u.full_name, role:u.role }};
  }
  if (path === 'health') return { ok:true, data:{ status:'ok (demo mode)', ts:new Date().toISOString() }};
  if (path === 'dashboard/summary') return { ok:true, data:{ total_users:5, total_mahasiswa:3, total_dosen:1, total_courses:2, total_presence:MOCK_DB.presence.length, today_checkins:MOCK_DB.presence.filter(p=>p.checkin_ts.startsWith(new Date().toISOString().slice(0,10))).length, ts:new Date().toISOString() }};
  if (path === 'admin/users') return { ok:true, data:{ total:MOCK_DB.users.length, items:MOCK_DB.users }};
  if (path === 'admin/courses') return { ok:true, data:{ total:MOCK_DB.courses.length, items:MOCK_DB.courses }};
  if (path === 'admin/sessions') {
    let s = MOCK_DB.sessions;
    if (data && data.course_id) s = s.filter(x => x.course_id === data.course_id);
    return { ok:true, data:{ total:s.length, items:s }};
  }
  // QR Generate
  if (path === 'presence/qr/generate') {
    const course = MOCK_DB.courses.find(c => c.course_id === data.course_id);
    const session = MOCK_DB.sessions.find(s => s.session_id === data.session_id);
    const token = 'TKN-' + Math.random().toString(36).slice(2,8).toUpperCase();
    const expires = new Date(Date.now() + (data.duration_minutes||5)*60000).toISOString();
    const payload = JSON.stringify({ t:token, c:data.course_id, s:data.session_id, e:expires });
    MOCK_DB.tokens.push({ qr_token:token, course_id:data.course_id, session_id:data.session_id, expires_at:expires, status:'active', course_name:course?.course_name, room:session?.room||'' });
    return { ok:true, data:{ qr_token:token, qr_payload:payload, course_name:course?.course_name, room:session?.room, expires_at:expires, duration_minutes:data.duration_minutes||5 }};
  }
  // Check-in
  if (path === 'presence/checkin') {
    const tok = MOCK_DB.tokens.find(t => t.qr_token === data.qr_token && t.status === 'active');
    if (!tok) return { ok:false, error:'token_invalid' };
    if (new Date(tok.expires_at) < new Date()) return { ok:false, error:'token_expired' };
    const dup = MOCK_DB.presence.find(p => p.user_id===data.user_id && p.course_id===data.course_id && p.session_id===data.session_id);
    if (dup) return { ok:true, data:{ presence_id:dup.presence_id, status:'already_checked_in', course_name:tok.course_name }};
    const pid = 'PR-'+Math.random().toString(36).slice(2,8).toUpperCase();
    const geo = (data.lat && tok.geo_fence_lat) ? 'in_range' : 'not_verified';
    MOCK_DB.presence.push({ presence_id:pid, user_id:data.user_id, course_id:data.course_id, session_id:data.session_id, status:'checked_in', checkin_ts:new Date().toISOString(), course_name:tok.course_name, room:tok.room, geo_status:geo });
    return { ok:true, data:{ presence_id:pid, status:'checked_in', course_name:tok.course_name, room:tok.room, geo_status:geo, checkin_ts:new Date().toISOString() }};
  }
  // Status
  if (path.startsWith('presence/status')) {
    const p = MOCK_DB.presence.find(x => x.user_id===data.user_id && x.course_id===data.course_id && x.session_id===data.session_id);
    if (!p) return { ok:true, data:{ status:'not_checked_in', user_id:data.user_id, course_id:data.course_id, session_id:data.session_id, last_ts:null }};
    return { ok:true, data:p };
  }
  if (path.startsWith('presence/list')) {
    const list = MOCK_DB.presence.filter(p => p.course_id===data.course_id && p.session_id===data.session_id);
    return { ok:true, data:{ items:list, total:list.length }};
  }
  if (path === 'admin/users' && method==='POST') {
    const uid = data.role.charAt(0).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
    MOCK_DB.users.push({...data, user_id:uid, is_active:'true'});
    return { ok:true, data:{ user_id:uid }};
  }
  if (path === 'admin/courses' && method==='POST') {
    const cid = 'CRS-'+Math.random().toString(36).slice(2,8).toUpperCase();
    MOCK_DB.courses.push({...data, course_id:cid, status:'active'});
    STATE.courses = MOCK_DB.courses;
    return { ok:true, data:{ course_id:cid }};
  }
  if (path === 'admin/sessions' && method==='POST') {
    const c = MOCK_DB.courses.find(x=>x.course_id===data.course_id);
    const num = MOCK_DB.sessions.filter(s=>s.course_id===data.course_id).length+1;
    const sid = data.course_id+'-S'+String(num).padStart(2,'0');
    MOCK_DB.sessions.push({...data, session_id:sid, session_num:num, course_name:c?.course_name, status:'scheduled'});
    return { ok:true, data:{ session_id:sid }};
  }
  if (path === 'telemetry/accel') return { ok:true, data:{ accepted:data.samples?.length||0 }};
  if (path === 'telemetry/accel/latest') return { ok:true, data:{ t:new Date().toISOString(), x:(Math.random()*0.4-0.2).toFixed(3)*1, y:(Math.random()*0.4-0.2).toFixed(3)*1, z:(9.5+Math.random()*0.5).toFixed(3)*1, magnitude:9.8 }};
  if (path === 'telemetry/gps') return { ok:true, data:{ accepted:true }};
  if (path === 'telemetry/gps/latest') return { ok:true, data:{ lat:-7.2575+Math.random()*0.001, lng:112.7521+Math.random()*0.001, accuracy_m:12.5, ts:new Date().toISOString() }};
  if (path === 'telemetry/gps/history') return { ok:true, data:{ device_id:data.device_id, items:Array.from({length:10},(_,i)=>({ ts:new Date(Date.now()-i*10000).toISOString(), lat:-7.2575+i*0.0001, lng:112.7521+i*0.0001 })).reverse() }};
  return { ok:false, error:'not_implemented_in_demo' };
}

// AUTH

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { showToast('Isi username dan password', 'error'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  const res = await api('POST', 'auth/login', { username, password }, true);
  btn.disabled = false;
  btn.innerHTML = '<span id="loginBtnText">Masuk</span>';

  if (!res.ok) { showToast(res.error || 'Login gagal', 'error'); return; }

  STATE.user  = res.data;
  STATE.token = res.data.auth_token;
  localStorage.setItem('ca_token', STATE.token);
  localStorage.setItem('ca_user',  JSON.stringify(res.data));

  initApp();
}

function doLogout() {
  stopTelemetry();
  STATE.user = STATE.token = null;
  localStorage.removeItem('ca_token');
  localStorage.removeItem('ca_user');
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ============================================================
// INIT
// ============================================================

function initApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');

  const u = STATE.user;
  document.getElementById('sidebarUserName').textContent = u.full_name;
  document.getElementById('sidebarUserRole').textContent = u.role;
  document.getElementById('userAvatar').textContent = u.full_name.charAt(0).toUpperCase();

  // Build nav
  buildNav(u.role);

  // Clock
  setInterval(() => {
    document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString('id-ID');
  }, 1000);

  // Load courses into state
  loadCoursesState();

  navigate('dashboard');
}

function buildNav(role) {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  const items = NAV_CONFIG[role] || NAV_CONFIG.mahasiswa;

  items.forEach(item => {
    if (item.section) {
      nav.innerHTML += `<div class="nav-section-label">${item.section}</div>`;
    } else {
      nav.innerHTML += `
        <div class="nav-item" id="nav-${item.id}" onclick="navigate('${item.id}')">
          <span class="icon">${item.icon}</span>
          <span>${item.label}</span>
        </div>`;
    }
  });
}

function navigate(page) {
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  closeSidebar();
  renderPage(page);
}

async function loadCoursesState() {
  const res = await api('GET', 'admin/courses', {});
  if (res.ok) STATE.courses = res.data.items || [];
}

function renderPage(page) {
  const titles = {
    dashboard: 'Dashboard', users: 'Manajemen Pengguna',

    </div>

    <div id="qrResult" style="display:none">
      <div class="card" style="margin-top:0">
        <div class="card-title">QR Code Aktif</div>
        <div class="qr-wrapper">
          <div class="qr-frame">
            <div id="qrDisplay"></div>
            <div class="qr-scan-line"></div>
          </div>
          <div class="qr-token-badge" id="qrTokenText">---</div>
          <div id="qrCourseInfo" style="text-align:center;font-size:13px;color:var(--text2)"></div>
          <div class="qr-timer" id="qrTimerDisplay">⏱ Expires in...</div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" onclick="generateQR()">🔄 Refresh QR</button>
            <button class="btn btn-success btn-sm" onclick="navigate('attendance')">📋 Lihat Presensi</button>
          </div>
        </div>
      </div>
    </div>`;

  window._allSessions = sessions;

  // Pre-fill if coming from sessions page
  if (STATE.pendingQR) {
    setTimeout(async () => {
      document.getElementById('qrCourse').value = STATE.pendingQR.course_id;
      await filterQRSessions();
      const sel = document.getElementById('qrSession');
      for (let opt of sel.options) {
        if (opt.value === STATE.pendingQR.session_id) { sel.value = STATE.pendingQR.session_id; break; }
      }
      STATE.pendingQR = null;
      generateQR();
    }, 100);
  }
}

function filterQRSessions() {
  const cid = document.getElementById('qrCourse').value;
  const sel = document.getElementById('qrSession');
  const filtered = (window._allSessions||[]).filter(s => s.course_id === cid);
  sel.innerHTML = `<option value="">— Pilih Sesi —</option>` +
    filtered.map(s=>`<option value="${s.session_id}">${s.session_date} | ${s.topic||'Sesi '+s.session_num}</option>`).join('');
  return filtered;
}

async function generateQR() {
  const course_id  = document.getElementById('qrCourse').value;
  const session_id = document.getElementById('qrSession').value;
  const duration   = parseInt(document.getElementById('qrDuration').value) || 5;

  if (!course_id || !session_id) { showToast('Pilih mata kuliah dan sesi', 'error'); return; }

  const res = await api('POST', 'presence/qr/generate', {
    course_id, session_id, duration_minutes: duration, ts: new Date().toISOString()
  });
  if (!res.ok) { showToast(res.error, 'error'); return; }

  const d = res.data;
  STATE.currentQR = d;

  document.getElementById('qrResult').style.display = 'block';
  document.getElementById('qrTokenText').textContent = d.qr_token;
  document.getElementById('qrCourseInfo').innerHTML =
    `<b>${d.course_name||''}</b>${d.room?' · '+d.room:''}`;

  // Render QR image
  const qrDiv = document.getElementById('qrDisplay');
  qrDiv.innerHTML = '';
  new QRCode(qrDiv, {
    text: d.qr_payload,
    width: 220, height: 220,
    colorDark: '#0a0f1e', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H,
  });

  // Start timer
  clearInterval(STATE.qrTimer);
  const expires = new Date(d.expires_at);
  STATE.qrTimer = setInterval(() => {
    const diff = Math.max(0, Math.floor((expires - new Date()) / 1000));
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    const el = document.getElementById('qrTimerDisplay');
    if (!el) { clearInterval(STATE.qrTimer); return; }
    el.textContent = `⏱ Expires in ${m}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('urgent', diff < 30);
    if (diff === 0) { el.textContent = '⚠️ QR Expired — klik Refresh'; clearInterval(STATE.qrTimer); }
  }, 1000);

  showToast('QR berhasil di-generate!', 'success');
}

async function startScanner() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video  = document.getElementById('scanVideo');
    if (!video) return;
    video.srcObject = stream;
    STATE.scannerActive = true;
    STATE.scannerStream = stream;
    document.getElementById('scanStatus').textContent = '🔍 Mencari QR Code...';
    requestAnimationFrame(scanFrame);
  } catch (e) {
    document.getElementById('scanStatus').textContent = '⚠️ Kamera tidak tersedia. Gunakan input manual.';
  }
}

function scanFrame() {
  if (!STATE.scannerActive) return;
  const video  = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  if (!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA) {
    requestAnimationFrame(scanFrame); return;
  }
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(img.data, img.width, img.height);
  if (code) {
    STATE.scannerActive = false;
    stopScannerStream();
    processQRCode(code.data);
  } else {
    requestAnimationFrame(scanFrame);
  }
}

function stopScannerStream() {
  if (STATE.scannerStream) {
    STATE.scannerStream.getTracks().forEach(t => t.stop());
    STATE.scannerStream = null;
  }
}

async function processQRCode(data) {
  let payload;
  try { payload = JSON.parse(data); } catch (_) { showToast('QR tidak valid', 'error'); return; }

  document.getElementById('scanStatus').innerHTML = `<div class="spinner" style="margin:auto"></div><br>Memproses check-in...`;

  // Get GPS
  const gpsData = await getGPSPosition();

  const user = STATE.user;
  const body = {
    user_id:    user.user_id,
    device_id:  getDeviceId(),
    course_id:  payload.c,
    session_id: payload.s,
    qr_token:   payload.t,
    ts:         new Date().toISOString(),
    ...(gpsData ? { lat: gpsData.lat, lng: gpsData.lng, accuracy_m: gpsData.accuracy } : {}),
  };

  const res = await api('POST', 'presence/checkin', body);
  const el  = document.getElementById('scanStatus');
  if (el) {
    if (res.ok) {
      el.innerHTML = `<span style="color:var(--green)">✅ Check-in Berhasil!</span>`;
      showCheckinSuccess(res.data, gpsData);
    } else {
      el.innerHTML = `<span style="color:var(--red)">❌ ${res.error}</span>`;
      showToast(res.error, 'error');
    }
  }
}

  document.getElementById('checkinGeoStatus').innerHTML = `

    ${gps ? `<div style="font-size:11px;color:var(--text2);margin-top:8px;font-family:var(--mono)">${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)} (±${gps.accuracy?.toFixed(0)}m)</div>` : ''}
  `;
  openModal('modalCheckinSuccess');
}

async function doManualCheckin() {
  const raw = document.getElementById('manualToken').value.trim();
  if (!raw) return;

  // Detect format: JSON payload or plain token
  let payload;
  try {
    payload = JSON.parse(raw);
  } catch (_) {
    // Treat as plain token — need course/session
    showToast('Masukkan format JSON payload atau scan QR', 'error'); return;
  }

  document.getElementById('manualToken').value = '';
  await processQRCode(JSON.stringify(payload));
}

function pageGPS() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="card">
      <div class="section-header">
        <div class="section-title">GPS Tracker</div>
        <div id="gpsStatusBadge"><span class="chip chip-amber">⏸ Standby</span></div>
      </div>
      <div id="gpsMap"></div>
      <div class="gps-info" style="margin-top:12px" id="gpsInfoPanel">
        <div class="gps-info-item"><div class="key">Latitude</div><div class="val" id="gpsLat">—</div></div>
        <div class="gps-info-item"><div class="key">Longitude</div><div class="val" id="gpsLng">—</div></div>
        <div class="gps-info-item"><div class="key">Accuracy</div><div class="val" id="gpsAcc">—</div></div>
        <div class="gps-info-item"><div class="key">Last Update</div><div class="val" id="gpsTs">—</div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-success" id="gpsStartBtn" onclick="startGPS()" style="flex:1">▶ Mulai Tracking</button>
        <button class="btn btn-danger"  id="gpsStopBtn"  onclick="stopGPS()"  style="flex:1" disabled>⏹ Stop</button>
      </div>
    </div>`;

  // Init map
  setTimeout(() => {
    STATE.gpsMap = L.map('gpsMap').setView([-7.2575, 112.7521], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
    }).addTo(STATE.gpsMap);
  }, 100);
}

async function startGPS() {
  document.getElementById('gpsStartBtn').disabled = true;
  document.getElementById('gpsStopBtn').disabled  = false;
  document.getElementById('gpsStatusBadge').innerHTML = `<span class="chip chip-green" style="animation:pulse 1.5s infinite">● Live</span>`;
  STATE.gpsTracking = true;

  const trackLoop = async () => {
    if (!STATE.gpsTracking) return;
    const pos = await getGPSPosition();
    if (pos) {
      updateGPSDisplay(pos);
      await api('POST', 'telemetry/gps', { device_id:getDeviceId(), lat:pos.lat, lng:pos.lng, accuracy_m:pos.accuracy, ts:new Date().toISOString() });
      updateGPSMap(pos);
    }
    STATE.gpsInterval = setTimeout(trackLoop, CONFIG.GPS_INTERVAL);
  };

  trackLoop();
}

function stopGPS() {
  STATE.gpsTracking = false;
  clearTimeout(STATE.gpsInterval);
  document.getElementById('gpsStartBtn').disabled = false;
  document.getElementById('gpsStopBtn').disabled  = true;
  document.getElementById('gpsStatusBadge').innerHTML = `<span class="chip chip-amber">⏸ Stopped</span>`;
}

function updateGPSDisplay(pos) {
  const f = n => n.toFixed(6);
  document.getElementById('gpsLat').textContent = f(pos.lat);
  document.getElementById('gpsLng').textContent = f(pos.lng);
  document.getElementById('gpsAcc').textContent = pos.accuracy ? pos.accuracy.toFixed(1)+'m' : '—';
  document.getElementById('gpsTs').textContent  = new Date().toLocaleTimeString('id-ID');
}

function updateGPSMap(pos) {
  if (!STATE.gpsMap) return;
  const latlng = [pos.lat, pos.lng];

  if (STATE.gpsMarker) STATE.gpsMarker.setLatLng(latlng);
  else STATE.gpsMarker = L.circleMarker(latlng, { color:'#3b82f6', fillColor:'#3b82f6', fillOpacity:0.8, radius:8 }).addTo(STATE.gpsMap);

  STATE.gpsHistory.push(latlng);
  if (STATE.gpsPolyline) STATE.gpsPolyline.setLatLngs(STATE.gpsHistory);
  else STATE.gpsPolyline = L.polyline(STATE.gpsHistory, { color:'#3b82f6', weight:3, opacity:0.7 }).addTo(STATE.gpsMap);

  STATE.gpsMap.setView(latlng, Math.max(STATE.gpsMap.getZoom(), 16));
}

let accelBatch = [];

async function startAccel() {
  if (!window.DeviceMotionEvent) {
    showToast('DeviceMotion tidak tersedia — menggunakan simulasi', 'info');
    startAccelSimulated();
    return;
  }

  // Request permission (iOS 13+)
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    const perm = await DeviceMotionEvent.requestPermission();
    if (perm !== 'granted') { showToast('Izin sensor ditolak', 'error'); return; }
  }

  document.getElementById('accelStartBtn').disabled = true;
  document.getElementById('accelStopBtn').disabled  = false;
  document.getElementById('accelStatusBadge').innerHTML = `<span class="chip chip-green" style="animation:pulse 1.5s infinite">● Live</span>`;

  STATE.accelTracking = true;
  window.addEventListener('devicemotion', handleMotion);

  // Send batch every interval
  STATE.accelInterval = setInterval(sendAccelBatch, CONFIG.ACCEL_INTERVAL);
}

function handleMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const x = +(a.x||0).toFixed(4), y = +(a.y||0).toFixed(4), z = +(a.z||0).toFixed(4);
  accelBatch.push({ t: new Date().toISOString(), x, y, z });
  updateAccelDisplay(x, y, z);
}

function startAccelSimulated() {
  document.getElementById('accelStartBtn').disabled = true;
  document.getElementById('accelStopBtn').disabled  = false;
  document.getElementById('accelStatusBadge').innerHTML = `<span class="chip chip-green" style="animation:pulse 1.5s infinite">● Simulated</span>`;
  STATE.accelTracking = true;

  const simLoop = () => {
    if (!STATE.accelTracking) return;
    const x = +(Math.random()*0.4-0.2).toFixed(4);
    const y = +(Math.random()*0.4-0.2).toFixed(4);
    const z = +(9.5+Math.random()*0.5).toFixed(4);
    accelBatch.push({ t:new Date().toISOString(), x, y, z });
    updateAccelDisplay(x, y, z);
    setTimeout(simLoop, 300);
  };

  simLoop();
  STATE.accelInterval = setInterval(sendAccelBatch, CONFIG.ACCEL_INTERVAL);
}

function updateAccelDisplay(x, y, z) {
  const xEl = document.getElementById('accelX');
  if (!xEl) return;
  xEl.textContent = x.toFixed(3);
  document.getElementById('accelY').textContent = y.toFixed(3);
  document.getElementById('accelZ').textContent = z.toFixed(3);
  const mag = Math.sqrt(x*x+y*y+z*z);
  document.getElementById('accelMag').textContent = mag.toFixed(3);

  // Animate bars
  const bars = document.querySelectorAll('.accel-bar');
  if (bars.length) {
    const toH = v => Math.max(4, Math.min(56, Math.abs(v) * 100)) + 'px';
    bars[0].style.height = bars[1].style.height = bars[2].style.height = toH(x);
    bars[3].style.height = bars[4].style.height = toH(y);
    bars[5].style.height = bars[6].style.height = bars[7].style.height = toH(z);
  }
}

async function sendAccelBatch() {
  if (!accelBatch.length) return;
  const batch = [...accelBatch];
  accelBatch = [];

  const res = await api('POST', 'telemetry/accel', {
    device_id: getDeviceId(), ts: new Date().toISOString(), samples: batch
  });

  const log = document.getElementById('accelLog');
  if (log) {
    log.innerHTML = `<div>[${new Date().toLocaleTimeString('id-ID')}] Batch ${batch.length} samples → ${res.ok?'✅ accepted:'+res.data?.accepted:'❌ '+res.error}</div>` + log.innerHTML;
  }
}

function stopAccel() {
  STATE.accelTracking = false;
  clearInterval(STATE.accelInterval);
  window.removeEventListener('devicemotion', handleMotion);
  accelBatch = [];
  document.getElementById('accelStartBtn').disabled = false;
  document.getElementById('accelStopBtn').disabled  = true;
  document.getElementById('accelStatusBadge').innerHTML = `<span class="chip chip-amber">⏸ Stopped</span>`;
}

function stopTelemetry() {
  if (STATE.gpsTracking) { STATE.gpsTracking = false; clearTimeout(STATE.gpsInterval); }
  if (STATE.accelTracking) stopAccel();
  if (STATE.scannerActive) { STATE.scannerActive = false; stopScannerStream(); }
  if (STATE.qrTimer) { clearInterval(STATE.qrTimer); STATE.qrTimer = null; }
  STATE.gpsMap = STATE.gpsMarker = STATE.gpsPolyline = null;
  STATE.gpsHistory = [];
}

// ============================================================
// UTILITY
// ============================================================

function getDeviceId() {
  let id = localStorage.getItem('ca_device_id');
  if (!id) {
    id = 'DEV-' + Math.random().toString(36).slice(2,10).toUpperCase();
    localStorage.setItem('ca_device_id', id);
  }
  return id;
}

function getGPSPosition() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      ()  => resolve(null),
      { timeout: 8000, maximumAge: 10000, enableHighAccuracy: true }
    );
  });
}

function showToast(msg, type = 'info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const id = 'toast-' + Date.now();
  const html = `
    <div class="toast ${type}" id="${id}">
      <span class="toast-icon">${icons[type]||'ℹ️'}</span>
      <span class="toast-msg">${msg}</span>
      <span class="toast-close" onclick="this.parentElement.remove()">✕</span>
    </div>`;
  document.getElementById('toastContainer').insertAdjacentHTML('beforeend', html);
  setTimeout(() => document.getElementById(id)?.remove(), 4000);
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}
